server:
  port: 8080

spring:
  application:
    name: enterprise-search-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/enterprise_search}
    elasticsearch:
      repositories:
        enabled: false
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

search:
  index-name: documents
  # Load bundled sample documents into MongoDB + Elasticsearch on first start
  seed-sample-data: ${SEED_SAMPLE_DATA:true}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
